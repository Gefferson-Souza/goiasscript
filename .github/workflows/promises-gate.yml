name: Promessas públicas

on:
  push:
    branches: [main, 'v3/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  promises-gate:
    name: promises-gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24 }
      - name: CLAUDE.md e copilot-instructions.md só citam o que existe
        run: node scripts/check-agent-docs.ts

  tarball:
    name: tarball (node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    concurrency:
      group: tarball-${{ github.workflow }}-${{ github.ref }}-${{ matrix.node }}-${{ matrix.os }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
        os: [ubuntu-24.04, windows-2025, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: E2E do tarball instalado em pasta limpa
        run: pnpm --filter goiasscript test:e2e
