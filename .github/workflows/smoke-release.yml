name: Smoke pós-publicação

on:
  workflow_dispatch:
    inputs:
      dist:
        description: 'Dist-tag do npm que acabou de sair'
        required: true
        default: latest
        type: choice
        options:
          - latest
          - next
      playground_url:
        description: 'Endereço https do playground implantado (vazio pula o smoke dele)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  package:
    name: package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      DIST_TAG: ${{ inputs.dist }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24 }
      - name: Instala o pacote publicado e confere versão, licença e comando
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/smoke-release.ts "$DIST_TAG"

  extension:
    name: extension
    needs: package
    uses: ./.github/workflows/smoke-extension.yml

  playground:
    name: playground
    needs: package
    if: ${{ inputs.playground_url != '' }}
    uses: ./.github/workflows/playground-smoke.yml
    with:
      base_url: ${{ inputs.playground_url }}
