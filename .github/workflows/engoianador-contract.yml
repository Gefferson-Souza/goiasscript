name: Contrato do Engoianador

on:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24 }
      - name: Confere a Groq e a API implantada
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ENGOIANADOR_URL: ${{ vars.ENGOIANADOR_URL }}
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON apps/engoianador-api/scripts/contract-check.ts
