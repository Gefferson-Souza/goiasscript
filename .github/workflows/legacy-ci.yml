name: CI legado

on:
  push:
    branches: [main, 'v3/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  legacy-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['18.x', '20.x', '22.x']

    steps:
      - name: Checkout código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        # Versão lida automaticamente de packageManager no package.json

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Executar linting
        run: pnpm legacy:lint

      - name: Verificar formatação
        run: pnpm legacy:format:check
        continue-on-error: true

      - name: Executar testes com cobertura
        run: pnpm legacy:test:coverage

      - name: Smoke test CLI
        run: |
          cd packages/core
          node bin/goiasscript.js --version
          node bin/goiasscript.js dedo_de_prosa
          node bin/goiasscript.js traduz examples/basic/exemplo.gs

      - name: Smoke test browser entry
        run: |
          cd packages/core
          node -e "const {GoiasScriptBrowserCompiler}=require('./src/browser'); const r=new GoiasScriptBrowserCompiler().transpile('uai x é 42; prosa(x)'); if(!r.success) {console.error(r.error); process.exit(1)}; console.log('browser entry OK')"

  build-apps:
    runs-on: ubuntu-latest
    needs: legacy-test
    steps:
      - name: Checkout código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js 20.x
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          cache: 'pnpm'

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Build do playground
        run: pnpm playground:build

      - name: Typecheck do engoianador
        run: pnpm engoianador:typecheck

  engoianador-test:
    runs-on: ubuntu-latest
    needs: legacy-test
    steps:
      - name: Checkout código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js 24.x
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          cache: 'pnpm'

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Testes do Worker (rate-limit, CORS, prompt injection)
        run: pnpm engoianador:test

  e2e:
    runs-on: ubuntu-latest
    needs: legacy-test
    steps:
      - name: Checkout código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js 20.x
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          cache: 'pnpm'

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Instalar navegador do Playwright (chromium)
        run: pnpm --filter playground-e2e exec playwright install --with-deps chromium

      - name: Rodar E2E (playground sobe via webServer)
        run: pnpm --filter playground-e2e exec playwright test --project=chromium
        env:
          CI: '1'

      - name: Upload artefatos do Playwright
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: apps/playground-e2e/playwright-report/
          retention-days: 7
