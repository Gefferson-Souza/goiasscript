name: E2E do playground

on:
  push:
    branches: [main, 'v3/**']
    paths: ['apps/playground/**', 'apps/playground-e2e/**', 'packages/**', '.github/workflows/playground-e2e.yml']
  pull_request:
    branches: [main]
    paths: ['apps/playground/**', 'apps/playground-e2e/**', 'packages/**', '.github/workflows/playground-e2e.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playground-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: e2e (${{ matrix.browser }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Instala o navegador e as dependências do sistema
        run: pnpm --filter playground-e2e exec playwright install --with-deps ${{ matrix.browser }}
      - name: Roda o E2E no navegador da matriz
        run: pnpm --filter playground-e2e exec playwright test --project=${{ matrix.browser }} --pass-with-no-tests
        env:
          CI: 'true'
      - name: Envia relatório e trace
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.browser }}
          path: |
            apps/playground-e2e/playwright-report/
            apps/playground-e2e/test-results/
          retention-days: 7
