# Os ambientes `marketplace` e `open-vsx` e as variáveis do Azure são criados pelo dono antes da primeira tag.
name: Release da extensão

on:
  push:
    tags: ['vscode-v*']

permissions:
  contents: read

env:
  HUSKY: '0'

jobs:
  verify:
    name: release-verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - name: Dicionários do gate de idioma
        run: sudo apt-get update && sudo apt-get install --yes wbrazilian wamerican wbritish
      - run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm run verify

  package:
    name: package
    needs: verify
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.target.outputs.version }}
      pre_release: ${{ steps.target.outputs.pre_release }}
      sha256: ${{ steps.vsix.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Calcula versão e canal
        id: target
        run: node scripts/release-target-vscode.ts >> "$GITHUB_OUTPUT"
      - name: Empacota a extensão
        run: pnpm run pack:vscode
      - name: Confere o vsix e exporta o sha256
        id: vsix
        env:
          EXPECTED_VERSION: ${{ steps.target.outputs.version }}
        run: |
          cd packages/vscode/pack
          mapfile -t VSIXES < <(find "$PWD" -name '*.vsix')
          if [ "${#VSIXES[@]}" -ne 1 ]; then
            echo "Eita! Esperava exatamente um vsix e achei ${#VSIXES[@]}." >&2
            exit 1
          fi
          case "${VSIXES[0]}" in
            *"-$EXPECTED_VERSION.vsix") ;;
            *) echo "Eita! O vsix não é da versão $EXPECTED_VERSION." >&2; exit 1 ;;
          esac
          node "$GITHUB_WORKSPACE/scripts/sha256-file.ts" "${VSIXES[0]}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vscode-vsix
          path: packages/vscode/pack/*.vsix
          if-no-files-found: error

  integration:
    name: integration (${{ matrix.os }}, ${{ matrix.vscode }})
    needs: package
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
        vscode: [stable, '1.90.0']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vscode-vsix
          path: vsix
      - name: Confere o sha256 do vsix baixado
        shell: bash
        env:
          EXPECTED_SHA256: ${{ needs.package.outputs.sha256 }}
        run: node scripts/sha256-file.ts "$(find vsix -name '*.vsix' | head -n 1)" "$EXPECTED_SHA256"
      - name: Testa dentro do VS Code
        shell: bash
        env:
          GS_VSCODE_VERSION: ${{ matrix.vscode }}
        run: |
          GS_VSIX="$(find "$PWD/vsix" -name '*.vsix' | head -n 1)"
          if command -v cygpath > /dev/null; then GS_VSIX="$(cygpath -m "$GS_VSIX")"; fi
          export GS_VSIX
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run --auto-servernum pnpm --filter goiasscript-vscode run test:integration
          else
            pnpm --filter goiasscript-vscode run test:integration
          fi

  publish-marketplace:
    name: publish-marketplace
    needs: [package, integration]
    runs-on: ubuntu-24.04
    environment: marketplace
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - name: Confere que o commit da tag está na main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Ô rapaz! O commit da tag não tá na main, não publico." >&2
            exit 1
          fi
      - run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile --filter goiasscript-vscode
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vscode-vsix
          path: vsix
      - name: Confere o sha256 do vsix baixado
        env:
          EXPECTED_SHA256: ${{ needs.package.outputs.sha256 }}
        run: node scripts/sha256-file.ts "$(find vsix -name '*.vsix' | head -n 1)" "$EXPECTED_SHA256"
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Publica no Marketplace
        env:
          PRE_RELEASE: ${{ needs.package.outputs.pre_release }}
        run: |
          VSIX="$(find "$PWD/vsix" -name '*.vsix' | head -n 1)"
          CHANNEL=()
          if [ "$PRE_RELEASE" = true ]; then CHANNEL=(--pre-release); fi
          pnpm --filter goiasscript-vscode exec vsce publish --packagePath "$VSIX" --azure-credential "${CHANNEL[@]}"

  publish-openvsx:
    name: publish-openvsx
    needs: [package, integration]
    runs-on: ubuntu-24.04
    environment: open-vsx
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - name: Confere que o commit da tag está na main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Ô rapaz! O commit da tag não tá na main, não publico." >&2
            exit 1
          fi
      - run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile --filter goiasscript-vscode
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vscode-vsix
          path: vsix
      - name: Confere o sha256 do vsix baixado
        env:
          EXPECTED_SHA256: ${{ needs.package.outputs.sha256 }}
        run: node scripts/sha256-file.ts "$(find vsix -name '*.vsix' | head -n 1)" "$EXPECTED_SHA256"
      - name: Publica no Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
          PRE_RELEASE: ${{ needs.package.outputs.pre_release }}
        run: |
          VSIX="$(find "$PWD/vsix" -name '*.vsix' | head -n 1)"
          CHANNEL=()
          if [ "$PRE_RELEASE" = true ]; then CHANNEL=(--pre-release); fi
          pnpm --filter goiasscript-vscode exec ovsx publish "$VSIX" "${CHANNEL[@]}"
