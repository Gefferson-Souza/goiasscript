# O trusted publisher é criado só imediatamente antes do primeiro publish e expira em 2 dias sem publish validado.
name: Release

on:
  push:
    tags: ['v3.*']

permissions:
  contents: read

env:
  HUSKY: '0'

jobs:
  verify:
    name: release-verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - name: Dicionários do gate de idioma
        run: sudo apt-get update && sudo apt-get install --yes wbrazilian wamerican wbritish
      - run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm run verify

  pack:
    name: pack
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Empacota o CLI
        run: pnpm run pack:cli
      - name: Guarda o sha256 do tarball
        run: |
          cd packages/cli/pack
          sha256sum -- *.tgz > tarball.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-tarball
          path: |
            packages/cli/pack/*.tgz
            packages/cli/pack/tarball.sha256
          if-no-files-found: error

  tarball-gate:
    name: tarball-gate (${{ matrix.os }})
    needs: pack
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cli-tarball
          path: tarball
      - name: Testa o tarball instalado
        shell: bash
        run: |
          GS_TARBALL="$(find "$PWD/tarball" -name '*.tgz' | head -n 1)"
          if command -v cygpath > /dev/null; then GS_TARBALL="$(cygpath -m "$GS_TARBALL")"; fi
          export GS_TARBALL
          pnpm --filter goiasscript run test:e2e

  publish:
    name: publish
    needs: tarball-gate
    runs-on: ubuntu-24.04
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - name: Confere que o commit da tag está na main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Ô rapaz! O commit da tag não tá na main, não publico." >&2
            exit 1
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24, registry-url: 'https://registry.npmjs.org' }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cli-tarball
          path: tarball
      - name: Confere o sha256 do tarball baixado
        working-directory: tarball
        run: sha256sum --check --strict tarball.sha256
      - name: Calcula versão e dist-tag
        id: target
        run: node scripts/release-target.ts >> "$GITHUB_OUTPUT"
      - name: Escolhe o tarball e confere a versão de dentro dele
        id: tarball
        env:
          EXPECTED_VERSION: ${{ steps.target.outputs.version }}
        run: |
          mapfile -t TARBALLS < <(find "$PWD/tarball" -name '*.tgz')
          if [ "${#TARBALLS[@]}" -ne 1 ]; then
            echo "Eita! Esperava exatamente um tarball e achei ${#TARBALLS[@]}." >&2
            exit 1
          fi
          PACKED_VERSION="$(tar -xOzf "${TARBALLS[0]}" package/package.json | node -p "JSON.parse(require('node:fs').readFileSync(0, 'utf8')).version")"
          if [ "$PACKED_VERSION" != "$EXPECTED_VERSION" ]; then
            echo "Eita! O tarball tem a versão $PACKED_VERSION e a tag pede $EXPECTED_VERSION." >&2
            exit 1
          fi
          echo "path=${TARBALLS[0]}" >> "$GITHUB_OUTPUT"
      - name: Instala o npm com stage
        run: npm install --global npm@12.2.1
      - name: Confere o npm com stage e a flag de provenance
        run: |
          npm --version
          npm stage publish --help | grep --quiet -- '--tag'
          npm stage publish --help | grep --quiet -- '--provenance'
      - name: Prepara o stage do tarball na dist-tag da tag
        env:
          DIST_TAG: ${{ steps.target.outputs.dist_tag }}
          TARBALL: ${{ steps.tarball.outputs.path }}
        run: npm stage publish "$TARBALL" --tag "$DIST_TAG" --provenance
