name = "engoianador-api"
main = "src/index.ts"
compatibility_date = "2025-01-15"

# Vars públicas. O secret GROQ_API_KEY entra por `wrangler secret put GROQ_API_KEY`.
[vars]
ALLOWED_ORIGINS = "http://localhost:3000,https://playground.goiasscript.com.br"
GROQ_MODEL = "openai/gpt-oss-120b"
WORKERS_AI_MODEL = "@cf/meta/llama-3.1-8b-instruct"
RATE_LIMIT_PER_DAY = "20"
GLOBAL_DAILY_CAP = "2000"
MAX_INPUT_CHARS = "2000"
MAX_BODY_BYTES = "8192"
CACHE_TTL_SEC = "21600"

# Cota atômica: um objeto por chave de rede, com SQLite.
[[durable_objects.bindings]]
name = "QUOTA_LEDGER"
class_name = "QuotaLedgerObject"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["QuotaLedgerObject"]

# O id abaixo é um marcador: o check-worker-config recusa o deploy enquanto
# houver `COLE_O_ID`. Crie o namespace com `wrangler kv namespace create ENGOIANADOR_CACHE`.
[[kv_namespaces]]
binding = "ENGOIANADOR_CACHE"
id = "COLE_O_ID_DE_ENGOIANADOR_CACHE"

# Fallback quando a Groq falha.
[ai]
binding = "AI"
